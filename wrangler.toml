name = "sonteen-apk-builder"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
GITHUB_OWNER = "YOUR_GITHUB_USERNAME"
GITHUB_REPO = "SONTEEN-AUTO-APK-BUILDER"
GITHUB_WORKFLOW = "android-build.yml"
GITHUB_REF = "main"
MAX_UPLOAD_BYTES = "94371840"

[[r2_buckets]]
binding = "BUILDS"
bucket_name = "sonteen-apk-builds"

[[d1_databases]]
binding = "DB"
database_name = "sonteen-apk-jobs"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[assets]
directory = "./public"
binding = "ASSETS"
